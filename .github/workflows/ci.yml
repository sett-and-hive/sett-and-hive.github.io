name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - python-radar-migration

permissions:
  contents: read

env:
  UV_VERSION: "0.11.6"
  HARDEN_RUNNER_EGRESS_POLICY: audit

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@20cf305ff2072d973412fa9b1e3a4f227bda3c76
        with:
          egress-policy: ${{ env.HARDEN_RUNNER_EGRESS_POLICY }}
          disable-sudo-and-containers: true

      - name: Check out repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Read Python version
        run: echo "PYTHON_VERSION=$(head -n 1 .python-version)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@3259c6206f993105e3a61b142c2d97bf4b9ef83d
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ env.PYTHON_VERSION }}"

      - name: Sync locked environment
        run: uv sync --locked --group dev

      - name: Validate prek configuration
        run: uv run --locked prek validate-config .pre-commit-config.yaml

      - name: Run prek
        run: |
          uv run --locked prek run --all-files --show-diff-on-failure
          uv run --locked prek run --all-files --show-diff-on-failure --hook-stage pre-push

      - name: Run ty
        run: uv run --locked ty check

      - name: Run tests
        run: uv run --locked pytest

      - name: Run pip-audit
        run: uv run --locked pip-audit
